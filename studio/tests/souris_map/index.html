#legend .ln { width:46px; height:0; border-top:4px dashed #c4594a; }
#legend .tx { font:600 30px "Corm"; color:var(--ink); letter-spacing:.5px; }
#legend .yr { font:20px "InterSB"; color:var(--ochre); letter-spacing:4px; }
#vig { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%); }
#grain { position:absolute; inset:0; mix-blend-mode:overlay; opacity:.10; }

<script>
  const D = 6.41;
  const tl = gsap.timeline({ paused: true });
  const cam = { cx: 1440.0, cy: 810.0, s: 1 / 1.5 };
  const camEl = document.getElementById("cam");
  const place = () => { camEl.style.transform = `translate(${960 - cam.cx * cam.s}px, ${540 - cam.cy * cam.s}px) scale(${cam.s})`; };
  place();
  tl.to(cam, { cx: 1389.6, cy: 825.6, s: 1.1538461538461537 / 1.5, duration: D, ease: "power1.inOut", onUpdate: place }, 0);
  // route: mask stroke drawn along the path, leading dot follows
  const rm = document.getElementById("rmask"); const len = rm.getTotalLength();
  rm.style.strokeDasharray = len; rm.style.strokeDashoffset = len;
  const head = document.getElementById("head"); const prog = { k: 0 };
  const moveHead = () => { const p = rm.getPointAtLength(prog.k * len); head.setAttribute("cx", p.x); head.setAttribute("cy", p.y);
                           head.setAttribute("opacity", prog.k > 0.001 && prog.k < 0.999 ? 1 : 0); rm.style.strokeDashoffset = len * (1 - prog.k); };
  moveHead();
  tl.to(prog, { k: 1, duration: D - 2.3, ease: "power2.inOut", onUpdate: moveHead }, 0.8);
  gsap.set("#lab-d", { xPercent: -50 }); gsap.set("#lab-s", { xPercent: -100 });
  tl.fromTo("#legend", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 1.0);
  tl.fromTo("#fort-d", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "back.out(2)" }, 0.15);
  tl.fromTo("#lab-d", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.3);
  tl.fromTo("#fort-s", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2)" }, 1.5);
  tl.fromTo("#pulse", { scale: 1, opacity: 0.9, transformOrigin: "50% 50%" }, { scale: 3.2, opacity: 0, duration: 1.4, ease: "power1.out", repeat: 2 }, 1.7);
  tl.fromTo("#lab-s", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 1.6);
  tl.fromTo("#lab-r", { opacity: 0 }, { opacity: 0.8, duration: 1.0 }, 1.8);
  tl.fromTo("#caption", { opacity: 0 }, { opacity: 0.85, duration: 0.8 }, 0.4);
  tl.to("#turb", { attr: { seed: 200 }, duration: D, ease: "steps(" + Math.round(D * 30) + ")" }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0);
